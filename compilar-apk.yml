name: Compilar APK WB TOPOGRAFIA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK Android
        uses: android-actions/setup-android@v3
      - name: Instalar Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Preparar Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar APK debug
        run: gradle --no-daemon assembleDebug
      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: WB-TOPOGRAFIA-APK-Android
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
